spring.application.name=api-gateway
server.port=8080

# ============================================
# EUREKA CLIENT
# ============================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# ROUTE STATIQUE - ENERGY MARKETPLACE
# ==========================================

#spring.cloud.gateway.server.webflux.routes[0].id=ENERGY-MARKETPLACE
#spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8083
#spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/offers,/api/offers/**,/api/requests,/api/requests/**,/api/reservations,/api/reservations/**


# ==========================================
# ROUTE 2 - ENERGY MONITORING
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=ENERGY-MONITORING
spring.cloud.gateway.server.webflux.routes[1].uri=lb://energy-monitoring-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/readings,/api/readings/**,/api/balances,/api/balances/**,/api/alerts,/api/alerts/**,/api/statistics,/api/statistics/**

# CIRCUIT BREAKER - ENERGY MONITORING

spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=monitoringCB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/monitoring

# ==========================================
# ROUTE DYNAMIQUE - ENERGY MARKETPLACE
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=ENERGY-MARKETPLACE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://energy-marketplace-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/offers,/api/offers/**,/api/requests,/api/requests/**,/api/reservations,/api/reservations/**



spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=marketplaceCB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/marketplace
# ==========================================
# SWAGGER - ENERGY MONITORING
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=MONITORING-SWAGGER
spring.cloud.gateway.server.webflux.routes[2].uri=lb://energy-monitoring-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/monitoring/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# ==========================================
# SWAGGER - ENERGY MARKETPLACE
# ==========================================

spring.cloud.gateway.server.webflux.routes[3].id=MARKETPLACE-SWAGGER
spring.cloud.gateway.server.webflux.routes[3].uri=lb://energy-marketplace-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/marketplace/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG



# ==========================================
# SWAGGER UI - ENERGYSHARE
# ==========================================

springdoc.swagger-ui.enabled=true

# Documentation Monitoring
springdoc.swagger-ui.urls[0].name=Energy Monitoring Service
springdoc.swagger-ui.urls[0].url=/monitoring/v3/api-docs

# Documentation Marketplace
springdoc.swagger-ui.urls[1].name=Energy Marketplace Service
springdoc.swagger-ui.urls[1].url=/marketplace/v3/api-docs

# Desactiver la documentation Swagger d'exemple
springdoc.swagger-ui.disable-swagger-default-url=true


logging.level.io.github.resilience4j.circuitbreaker=DEBUG
