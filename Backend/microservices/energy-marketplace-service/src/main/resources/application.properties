# ==========================================
# MARKETPLACE
# ==========================================
spring.application.name=energy-marketplace-service
server.port=8083

# ==========================================
# MONGODB ATLAS
# ==========================================
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=energyshare_marketplace

# ==========================================
# EUREKA CLIENT - TP
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==========================================
# APPLICATION INFO
# ==========================================
info.app.name=energy-marketplace-service
info.app.version=1.0.0
info.app.description=Microservice Marketplace EnergyShare
info.app.team=EnergyShare