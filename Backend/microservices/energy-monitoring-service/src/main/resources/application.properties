
server.port=8082
spring.application.name=energy-monitoring-service
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#actuator

# Exposer les endpoints health, info et metrics (seul health l'est par
défaut)
management.endpoints.web.exposure.include=health,info,metrics 

# Afficher le détail des composants dans /health (db, diskSpace, ping…)
management.endpoint.health.show-details=always
# Variante : afficher les composants sans leurs détails
#management.endpoint.health.show-components=always

# Transmettre à Eureka le statut de /health (Job passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true 

# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true 

# Contenu affiché par /actuator/info
info.app.name=energy-monitoring_service
info.app.version=1.0.0 
info.app.description=Microservice de gestion des offres





# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/energy_monitoring_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

