spring.application.name=transaction-service
server.port=${SERVER_PORT:8084}

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Marketplace Service (appel synchrone GET /reservations/{id}) ---
app.marketplace.base-url=${MARKETPLACE_URL:http://localhost:8083/api}
app.marketplace.connect-timeout=2s
app.marketplace.read-timeout=3s

# --- Evenements publies vers RabbitMQ ---
app.events.exchange=energyshare.transactions
app.events.queue=marketplace.transaction-events
app.events.confirmed-key=transaction.confirmed
app.events.cancelled-key=transaction.cancelled

# ==========================================
# EUREKA CLIENT
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# ACTUATOR
# ==========================================
# Exposer health, info et metrics (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le detail des composants dans /health (db, rabbit, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (DOWN si PostgreSQL ou RabbitMQ tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true

# ==========================================
# APPLICATION INFO (/actuator/info)
# ==========================================
info.app.name=transaction-service
info.app.version=1.0.0
info.app.description=Microservice Transaction EnergyShare
info.app.team=EnergyShare
